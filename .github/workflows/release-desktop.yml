name: Release desktop packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example, 1.2.3 or v1.2.3)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.24.0"

jobs:
  prepare:
    name: Validate release
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Normalize version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION#v}"
          if [[ ! "${version}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Version must use stable SemVer format X.Y.Z." >&2
            exit 1
          fi

          if [[ "${version}" == "0.0.0" ]]; then
            echo "0.0.0 is reserved for unversioned builds." >&2
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"

      - name: Reject an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Tag ${RELEASE_TAG} already exists." >&2
            exit 1
          fi
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists." >&2
            exit 1
          fi

  validate:
    name: Validate desktop application
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      protocol_sha: ${{ steps.protocol.outputs.sha }}
    defaults:
      run:
        working-directory: TodeX_desktop
    steps:
      - name: Checkout desktop
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: TodeX_desktop

      - name: Checkout shared protocol
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: youtonghy/TodeX_protocol
          ref: main
          path: TodeX_protocol
          token: ${{ secrets.PROTOCOL_REPO_TOKEN || github.token }}

      - name: Record shared protocol revision
        id: protocol
        shell: bash
        run: echo "sha=$(git -C ../TodeX_protocol rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm install --global pnpm@${{ env.PNPM_VERSION }}

      - name: Install dependencies
        shell: bash
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm rebuild

      - name: Validate application
        run: |
          pnpm run check:electron
          pnpm run typecheck
          pnpm run test:updates
          pnpm run build

  build:
    name: Build ${{ matrix.label }}
    needs:
      - prepare
      - validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            label: windows
            args: --win nsis --x64 --arm64
          - os: macos-15
            label: macos-arm64
            args: --mac dmg zip --arm64 -c.forceCodeSigning=true
          - os: ubuntu-24.04
            label: linux-x64
            args: --linux AppImage --x64
    defaults:
      run:
        working-directory: TodeX_desktop
    steps:
      - name: Checkout desktop
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: TodeX_desktop

      - name: Checkout shared protocol
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: youtonghy/TodeX_protocol
          ref: ${{ needs.validate.outputs.protocol_sha }}
          path: TodeX_protocol
          token: ${{ secrets.PROTOCOL_REPO_TOKEN || github.token }}

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm install --global pnpm@${{ env.PNPM_VERSION }}

      - name: Install dependencies
        shell: bash
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm rebuild

      - name: Require macOS signing certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "MAC_CSC_LINK must contain a code signing certificate (Developer ID Application or self-signed) for macOS auto-updates." >&2
            exit 1
          fi

      - name: Trust self-signed signing certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          echo "$CSC_LINK" | base64 --decode > "$tmpdir/signing.p12"
          openssl pkcs12 -in "$tmpdir/signing.p12" -nokeys -clcerts \
            -passin "pass:${CSC_KEY_PASSWORD}" \
            | openssl x509 -outform DER -out "$tmpdir/signing.cer"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign "$tmpdir/signing.cer"

      - name: Package desktop application
        shell: bash
        env:
          BUILD_ARGS: ${{ matrix.args }}
          TODEX_BUILD_VERSION: ${{ needs.prepare.outputs.version }}
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
        run: pnpm run package ${BUILD_ARGS} -c.extraMetadata.version=${TODEX_BUILD_VERSION} --publish never

      - name: Verify injected version
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: grep -R --fixed-strings --quiet "${RELEASE_VERSION}" out/renderer

      - name: Verify update metadata and checksums
        env:
          TODEX_BUILD_VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/verify-update-assets.mjs

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TodeX-v${{ needs.prepare.outputs.version }}-${{ matrix.label }}
          path: |
            TodeX_desktop/release/*.exe
            TodeX_desktop/release/*.dmg
            TodeX_desktop/release/*.zip
            TodeX_desktop/release/*.AppImage
            TodeX_desktop/release/*.blockmap
            TodeX_desktop/release/latest*.yml
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs:
      - prepare
      - validate
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download desktop packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Create checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - name: Create and verify release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          PROTOCOL_SHA: ${{ needs.validate.outputs.protocol_sha }}
        run: |
          gh release create "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "${RELEASE_TAG}" \
            --notes "Shared protocol commit: ${PROTOCOL_SHA}" \
            --generate-notes \
            --draft

          cleanup() {
            gh release delete "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --cleanup-tag --yes || true
          }
          trap cleanup ERR

          gh release upload "${RELEASE_TAG}" dist/* --repo "${GITHUB_REPOSITORY}"
          find dist -maxdepth 1 -type f -exec basename {} \; | sort > expected-assets.txt
          gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
            --json assets --jq '.assets[].name' | sort > uploaded-assets.txt
          diff -u expected-assets.txt uploaded-assets.txt

          gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false
          trap - ERR
