name: Desktop checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: desktop-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.24.0"

jobs:
  validate:
    name: Typecheck and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout desktop
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: TodeX_desktop

      - name: Checkout shared protocol
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: youtonghy/TodeX_protocol
          ref: main
          path: TodeX_protocol
          token: ${{ secrets.PROTOCOL_REPO_TOKEN || github.token }}

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm install --global pnpm@${{ env.PNPM_VERSION }}

      - name: Install dependencies
        working-directory: TodeX_desktop
        shell: bash
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm rebuild

      - name: Audit dependencies
        working-directory: TodeX_desktop
        run: pnpm audit --audit-level high

      - name: Check Electron
        working-directory: TodeX_desktop
        run: pnpm run check:electron

      - name: Typecheck
        working-directory: TodeX_desktop
        run: pnpm run typecheck

      - name: Test updates
        working-directory: TodeX_desktop
        run: pnpm run test:updates

      - name: Build
        working-directory: TodeX_desktop
        run: pnpm run build
