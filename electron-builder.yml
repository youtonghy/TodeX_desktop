appId: com.unbaked0692.todexdesktop
productName: TodeX

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json

extraResources:
  - from: build
    to: icons
    filter:
      - icon.png
      - icon.ico

asar: true

publish:
  provider: github
  owner: youtonghy
  repo: TodeX_desktop
  releaseType: release

mac:
  icon: build/icon.icns
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  artifactName: TodeX-v${version}-macos-${arch}.${ext}

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
        - arm64
  artifactName: TodeX-v${version}-windows-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  icon: build/icons
  category: Development
  target:
    - target: AppImage
      arch:
        - x64
  artifactName: TodeX-v${version}-linux-${arch}.${ext}
