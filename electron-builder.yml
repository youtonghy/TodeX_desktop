appId: com.unbaked0692.todexdesktop
productName: TodeX

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json

extraResources:
  - from: build
    to: icons
    filter:
      - icon.png
      - icon.ico
      - icon-light.png
      - icon-light.ico

asar: true

publish:
  provider: github
  owner: youtonghy
  repo: TodeX_desktop
  releaseType: release

mac:
  icon: build/icon.icns
  # The Computer Use helper (scripts/build-computer-helper.mjs), signed with
  # the app so it shares TodeX's Screen Recording / Accessibility grants.
  extraResources:
    - from: build/bin
      to: bin
      filter:
        - todex-computer
    - from: native/macos/TodexComputer/THIRD_PARTY_NOTICES.txt
      to: bin/THIRD_PARTY_NOTICES.txt
  binaries:
    - Contents/Resources/bin/todex-computer
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  artifactName: TodeX-v${version}-macos-${arch}.${ext}

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
        - arm64
  artifactName: TodeX-v${version}-windows-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  icon: build/icons
  category: Development
  target:
    - target: AppImage
      arch:
        - x64
  artifactName: TodeX-v${version}-linux-${arch}.${ext}
